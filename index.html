<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanjo App - قريباً</title>
    
    <!-- كود إحصائيات جوجل (شغال وبيسجل الزيارات) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-78PNF9KRN7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-78PNF9KRN7'); 
    </script>

    <!-- تصميم صفحة الانتظار الثابتة -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .logo {
            max-width: 220px; /* تم تكبير اللوجو لإبراز التفاصيل */
            margin-bottom: 25px;
        }
        .title-text {
            color: #420099; /* لون كانجو البنفسجي المأخوذ من الصندوق والكاب */
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .sub-text {
            color: #555555;
            font-size: 19px;
            line-height: 1.6;
            max-width: 400px;
        }
        .highlight {
            color: #FF9900; /* لون كانجو البرتقالي المأخوذ من الكنغر والكوفية */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- صورة اللوجو (تأكد إن اسم الصورة logo.png) -->
    <img src="logo.png" alt="Kanjo Logo" class="logo" onerror="this.style.display='none'">
    
    <div class="title-text">تطبيق Kanjo قريباً!</div>
    <p class="sub-text">
        نستعد حالياً لتغيير تجربة الطلب بالكامل.<br>
        <span class="highlight">أسطول التوصيل الخاص بنا</span> يتجهز للانطلاق لخدمتكم في أسرع وقت.
    </p>
</body>
</html>
